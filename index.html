<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: white;
            font-family: 'Helvetica Light', 'Helvetica', sans-serif;
            font-weight: 300;
        }

        .container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 2%;
            margin-top: 4%;
            gap: 2rem;
        }

        /* Header con logo y contacto */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding-bottom: 1rem;
        }

        .logo {
            height: 50px;
            object-fit: contain;
        }

        .contacto {
            font-family: 'Helvetica Light', 'Helvetica', sans-serif;
            font-weight: 300;
            font-size: 16px;
            letter-spacing: 0.05em;
        }

        /* Contenedor central con la foto */
        .main-content {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
        }

        .main-image {
            max-width: 100%;
            max-height: 80vh;
            object-fit: cover;
        }

        @media (max-width: 768px) {
            .container {
                margin: 2%;
                margin-top: 4%;
            }

            .logo {
                height: 40px;
            }

            .contacto {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="img/01_logo/logo.JPG" alt="Logo" class="logo">
            <span class="contacto">contacto</span>
        </div>

        <div class="main-content">
            <img src="img/02_reel base/01.jpg" alt="Reel" class="main-image">
        </div>
    </div>
</body>
</html>
